name: Test Edge Paths

on: [push, pull_request]

jobs:
    build-ununtu:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os:
                    - ubuntu-latest
                    - ubuntu-24.04
                node_version:
                    - 16
                    - 18
                    - 22
                    - 24
                    - 25
                architecture:
                    - x64
        name: Node ${{ matrix.node_version }} - ${{ matrix.architecture }} on ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node_version }}
                  architecture: ${{ matrix.architecture }}
            - run: npm install
            - run: node tests/downloadEdge.js
            - run: for f in *.deb;do echo $f;sudo apt install -y  ./$f; done
            - run: ls
            - run: node tests/index.js

    build-macos:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os:
                    - macos-latest
                    - macos-15
                node_version:
                    - 16
                    - 18
                    - 22
                    - 24
                    - 25
        name: Node ${{ matrix.node_version }} on ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node_version }}
            - run: npm install
            - run: node tests/downloadEdge.js
            - run: sudo su
            - run: sudo installer -allowUntrusted -pkg MicrosoftEdge-*.pkg -target /
            - run: sudo installer -allowUntrusted -pkg MicrosoftEdgeBeta-*.pkg -target /
            - run: sudo installer -allowUntrusted -pkg MicrosoftEdgeCanary-*.pkg -target /
            - run: sudo installer -allowUntrusted -pkg MicrosoftEdgeDev-*.pkg -target /
            - run: ls
            - run: node tests/index.js

    build-window:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os:
                    - windows-latest
                    - windows-2025
                node_version:
                    - 16
                    - 18
                    - 22
                    - 24
                    - 25
        name: Node ${{ matrix.node_version }} on ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node_version }}
            - uses: browser-actions/setup-edge@latest
              with:
                  edge-version: stable
            - uses: browser-actions/setup-edge@latest
              with:
                  edge-version: beta
            - uses: browser-actions/setup-edge@latest
              with:
                  edge-version: canary
            - uses: browser-actions/setup-edge@latest
              with:
                  edge-version: dev
            - run: npm install
            - run: node tests/index.js
